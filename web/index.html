<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bachelor Points - Mess Management Simplified">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-signin-client_id" content="225274585167-sl0mjs221qkokktn42ejegtm2ajouerr.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="bachelorpoints">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bachelor Points</title>
  <link rel="manifest" href="manifest.json">

  <!-- HTML Splash Screen Styles -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.4s ease-out;
    }

    .splash-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .splash-icon {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
    }

    .splash-icon svg {
      width: 40px;
      height: 40px;
      fill: #FFFFFF;
    }

    .splash-title {
      font-size: 26px;
      font-weight: 700;
      color: #F8FAFC;
      letter-spacing: -0.5px;
      margin: 0 0 8px 0;
    }

    .splash-subtitle {
      font-size: 14px;
      font-weight: 400;
      color: #94A3B8;
      margin: 0 0 32px 0;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #6366F1;
      animation: spin 0.8s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .splash-hidden {
      opacity: 0 !important;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Branded HTML Splash Screen -->
  <div id="splash">
    <div class="splash-container">
      <div class="splash-icon">
        <svg viewBox="0 0 24 24">
          <path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.46 3.89 3.42 4.36L6 22h2v-8.64C9.94 12.89 11.4 11.12 11 9zm9-7h-4v9c0 1.86 1.27 3.43 3 3.87V22h2V2h-1z"/>
        </svg>
      </div>
      <h1 class="splash-title">Bachelor Points</h1>
      <p class="splash-subtitle">Mess Management Simplified</p>
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    (function() {
      var splash = document.getElementById('splash');
      function hideSplash() {
        if (splash && !splash.classList.contains('splash-hidden')) {
          splash.classList.add('splash-hidden');
          setTimeout(function() {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 400);
        }
      }

      // Hide splash when Flutter fires first frame
      window.addEventListener('flutter-first-frame', hideSplash);

      // Fallback timeout in case event was missed
      setTimeout(hideSplash, 6000);
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
