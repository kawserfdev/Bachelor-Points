name: bachelorpoints
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management (Phase 0: add alongside GetX for migration)
  get: ^4.7.3
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation (Phase 0: add alongside GetX for migration)
  go_router: ^17.3.0

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_messaging: ^16.2.0
  firebase_analytics: ^12.4.2
  firebase_crashlytics: ^5.2.3
  firebase_remote_config: ^6.5.2
  firebase_storage: ^13.4.2
  firebase_app_check: ^0.4.1

  # Offline Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Code Generation (models)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Storage & Config
  get_storage: ^2.1.1
  flutter_dotenv: ^6.0.1

  # Utilities
  intl: ^0.20.2
  pdf: ^3.12.0
  printing: ^5.14.3
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  connectivity_plus: ^7.1.1
  logger: ^2.5.0
  equatable: ^2.0.7
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Background Sync
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.14
  freezed: ^3.2.5
  json_serializable: ^6.9.4
  # isar_generator removed due to source_gen conflict with freezed; schemas written manually for now
  riverpod_generator: ^4.0.3
  mockito: ^5.4.5
  mocktail: ^1.0.4
  # firebase_auth_mocks and fake_cloud_firestore pending compatible versions with cloud_firestore ^6.x

  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
